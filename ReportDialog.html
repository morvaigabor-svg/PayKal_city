<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; padding: 20px; color: #333; background-color: #f8f9fa; margin: 0; }
      .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
      .form-group { margin-bottom: 18px; }
      label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; color: #495057; }
      select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
      
      .radio-group { display: flex; gap: 20px; background: #e9ecef; padding: 10px; border-radius: 5px; }
      .radio-label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; }
      
      .picker-container { display: flex; gap: 10px; align-items: center; }
      .folder-display { flex-grow: 1; background-color: #e9ecef; cursor: not-allowed; }
      .btn { padding: 10px 16px; border: none; border-radius: 5px; font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.2s; }
      .btn-secondary { background-color: #198754; color: white; }
      .btn-secondary:hover { background-color: #157347; }
      .btn-primary { background-color: #0d6efd; color: white; width: 100%; font-size: 15px; padding: 12px; margin-top: 10px; }
      .btn-primary:hover { background-color: #0b5ed7; }
      .btn:disabled { background-color: #6c757d; cursor: not-allowed; }
      #status { margin-top: 15px; text-align: center; font-weight: 600; font-size: 13px; }
      .success-link { color: #0d6efd; font-weight: bold; text-decoration: none; }
    </style>
    <script src="https://apis.google.com/js/api.js"></script>
  </head>
  <body>

    <div class="card">
      <!-- 1. Kimutatás típusa -->
      <div class="form-group">
        <label>1. Kimutatás Típusa:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="reportType" value="group" checked onchange="handleTypeChange()"> 👥 Csoport kimutatás
          </label>
          <label class="radio-label">
            <input type="radio" name="reportType" value="city" onchange="handleTypeChange()"> 🏙️ Városi kimutatás
          </label>
        </div>
      </div>

      <!-- 2. Csoport / Város választó -->
      <div class="form-group">
        <label id="targetSelectLabel" for="targetSelect">2. Válassz Csoportot (Aktív csoportok):</label>
        <select id="targetSelect">
          <option value="">-- Adatok betöltése... --</option>
        </select>
      </div>

      <!-- 3. Új táblázat neve -->
      <div class="form-group">
        <label for="fileNameInput">3. Új Google Sheet Neve:</label>
        <input type="text" id="fileNameInput" placeholder="Pl. Elszámolás - KMCS060">
      </div>

      <!-- 4. Drive Mappa választó -->
      <div class="form-group">
        <label>4. Célmappa kiválasztása (Google Drive):</label>
        <div class="picker-container">
          <input type="text" id="folderNameDisplay" class="folder-display" value="Gyökérmappa (Saját Drive)" readonly>
          <input type="hidden" id="folderIdInput" value="root">
          <button type="button" class="btn btn-secondary" onclick="openDrivePicker()">📁 Mappa választása...</button>
        </div>
      </div>

      <!-- Létrehozás gomb -->
      <button id="submitBtn" class="btn btn-primary" onclick="submitCreateReport()">🚀 Létrehozás</button>
      <div id="status"></div>
    </div>

    <script>
      let pickerApiLoaded = false;
      let oauthToken = "";
      let globalSelectionData = { groups: [], cities: [], cityToGroups: {} };

      // Google Picker API betöltése
      gapi.load('picker', { 
        'callback': () => { pickerApiLoaded = true; },
        'onerror': () => { alert("Hiba a Google Picker könyvtár betöltésekor."); }
      });

      window.onload = function() {
        // Adatok lekérése a szervertől (Csoportok és Városok)
        google.script.run
          .withSuccessHandler(data => {
            globalSelectionData = data;
            handleTypeChange();
          })
          .getReportSelectionData();

        // Automatikus név-javaslat kitöltése
        document.getElementById('targetSelect').addEventListener('change', function() {
          const val = this.value;
          const type = document.querySelector('input[name="reportType"]:checked').value;
          if (val) {
            if (type === 'group') {
              document.getElementById('fileNameInput').value = "Kimutatás - " + val;
            } else {
              document.getElementById('fileNameInput').value = "Városi Kimutatás - " + val;
            }
          }
        });
      };

      function handleTypeChange() {
        const type = document.querySelector('input[name="reportType"]:checked').value;
        const select = document.getElementById('targetSelect');
        const label = document.getElementById('targetSelectLabel');

        select.innerHTML = '';

        if (type === 'group') {
          label.textContent = '2. Válassz Csoportot (Aktív csoportok):';
          if (!globalSelectionData.groups || globalSelectionData.groups.length === 0) {
            select.innerHTML = '<option value="">Nincs aktív csoport!</option>';
            return;
          }
          select.innerHTML = '<option value="">-- Válassz csoportot --</option>';
          globalSelectionData.groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g;
            opt.textContent = g;
            select.appendChild(opt);
          });
        } else {
          label.textContent = '2. Válassz Várost (Aktív városok):';
          if (!globalSelectionData.cities || globalSelectionData.cities.length === 0) {
            select.innerHTML = '<option value="">Nincs elérhető város!</option>';
            return;
          }
          select.innerHTML = '<option value="">-- Válassz várost --</option>';
          globalSelectionData.cities.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            select.appendChild(opt);
          });
        }

        document.getElementById('fileNameInput').value = '';
      }

      function openDrivePicker() {
        google.script.run
          .withSuccessHandler(token => {
            oauthToken = token;
            createPicker();
          })
          .withFailureHandler(err => alert("Token hiba: " + err))
          .getOAuthToken();
      }

      function createPicker() {
        try {
          const myDriveView = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true)
            .setLabel("Saját meghajtó");

          const sharedDrivesView = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true)
            .setEnableDrives(true)
            .setLabel("Megosztott meghajtók");

          const sharedWithMeView = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true)
            .setOwnedByMe(false)
            .setLabel("Velem megosztva");

          const origin = (google.script && google.script.host && google.script.host.origin) 
                          ? google.script.host.origin 
                          : "https://docs.google.com";

          const picker = new google.picker.PickerBuilder()
            .addView(myDriveView)
            .addView(sharedDrivesView)
            .addView(sharedWithMeView)
            .setOAuthToken(oauthToken)
            .setOrigin(origin)
            .setCallback(pickerCallback)
            .setTitle("Válaszd ki a célmappát")
            .setSize(1000, 550)
            .build();

          picker.setVisible(true);
        } catch (e) {
          alert("Picker Hiba: " + e.message);
        }
      }

      function pickerCallback(data) {
        if (data.action == google.picker.Action.PICKED) {
          const doc = data.docs[0];
          document.getElementById('folderNameDisplay').value = doc.name;
          document.getElementById('folderIdInput').value = doc.id;
        }
      }

      function submitCreateReport() {
        const type = document.querySelector('input[name="reportType"]:checked').value;
        const selectedVal = document.getElementById('targetSelect').value;
        const fileName = document.getElementById('fileNameInput').value.trim();
        const folderId = document.getElementById('folderIdInput').value;

        if (!selectedVal) {
          alert(type === 'group' ? "Kérlek válassz egy Csoport ID-t!" : "Kérlek válassz egy Várost!");
          return;
        }
        if (!fileName) {
          alert("Kérlek adj meg egy nevet az új táblázatnak!");
          return;
        }

        document.getElementById('submitBtn').disabled = true;
        document.getElementById('status').innerHTML = "⏳ Új Google Sheet generálása folyamatban...";

        google.script.run
          .withSuccessHandler(res => {
            document.getElementById('submitBtn').disabled = false;
            if (res.success) {
              document.getElementById('status').innerHTML = `✅ Sikeresen létrejött!<br><a href="${res.fileUrl}" target="_blank" class="success-link">👉 Megnyitás: ${res.fileName}</a>`;
            } else {
              document.getElementById('status').innerText = "❌ Hiba: " + res.message;
            }
          })
          .createGroupReportSheet({
            reportType: type,
            selectedValue: selectedVal,
            fileName: fileName,
            targetFolderId: folderId
          });
      }
    </script>
  </body>
</html>
